services:
  - type: web
    name: finsync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-production.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////tmp/finsync_intelligence.db
      - key: MARKET_DATA_MODE
        value: simulated
      - key: MARKET_DATA_PROVIDER
        value: upstox
      - key: SEMANTIC_RETRIEVAL_ENABLED
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
