services:
  - type: web
    name: finsync-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements-production.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: sqlite:////tmp/finsync_intelligence.db
      - key: MARKET_DATA_MODE
        value: free
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: YAHOO_FINANCE_ENABLED
        value: "true"
      - key: SEMANTIC_RETRIEVAL_ENABLED
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
